patch:
  sync_dir: ~/Library/Mobile\ Documents/com~apple~CloudDocs/Rime/
  schema_list:
    - schema: rime_ice
    - schema: double_pinyin_flypy
  menu:
    page_size: 5
  switcher:
    caption: 「方案选单」
    hotkeys:
      - Control+Shift+slash
    save_options:
      - ascii_punct
      - transcription
      - emoji_suggestion
      - full_shape
    fold_options: true
    abbreviate_options: true
    option_list_separator: ' / '
  ascii_composer:
    good_old_caps_lock: true
    switch_key:
      Caps_Lock: clear
      Shift_L: noop
      Shift_R: noop
      Control_L: noop
      Control_R: noop
  key_binder:
    bindings:
      - {when: composing, accept: Shift+Tab, send: Shift+Left}
      - {when: composing, accept: Tab, send: Shift+Right}
      - {when: has_menu, accept: minus, send: Page_Up}
      - {when: has_menu, accept: equal, send: Page_Down}
      - {when: always, accept: Control+Shift+E, toggle: emoji_suggestion}
