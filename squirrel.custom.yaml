patch:
  style:
    status_message_type: mix
    candidate_format: "[label]. [candidate] [comment]"
    candidate_list_layout: linear
    text_orientation: horizontal
    inline_preedit: true
    inline_candidate: false
    translucency: false
    mutual_exclusive: false
    memorize_size: false
    showPaging: false
    alpha: 1e+0
    corner_radius: 1.4e+1
    hilited_corner_radius: 1.2e+1
    border_height: 0e+0
    border_width: 0e+0
    line_spacing: 8e+0
    spacing: 4e+0
    base_offset: 4e+0
    shadow_size: 3e+0
    font_face: "AaZanJinXiaoKai-2"
    font_point: 27
    label_font_face: "AaZanJinXiaoKai-2"
    label_font_point: 16
    comment_font_face: "AaZanJinXiaoKai-2"
    comment_font_point: 16
    color_scheme: zanjinkai_black

  preset_color_schemes:
    zanjinkai_black:
      name: "攒劲小楷·暗黑"
      author: "Custom"
      color_space: srgb
      back_color: 0x1A1A1A       # 深黑背景
      border_color: 0x3A3A3A     # 深色边框
      text_color: 0xAAAAAA       # 拼音灰色
      hilited_text_color: 0xCCCCCC # 拼音高亮
      candidate_text_color: 0xDDDDDD  # 候选文字浅白
      hilited_candidate_text_color: 0x3B82F6  # 选中蓝色
      hilited_candidate_back_color: 0x1E3A5F  # 选中背景深灰
      label_color: 0x888888      # 序号灰
      hilited_candidate_label_color: 0x3B82F6  # 选中序号金色
      comment_text_color: 0x777777  # 注释拼音灰
      hilited_comment_text_color: 0xAA8800  # 选中注释金褐
