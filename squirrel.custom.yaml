patch:
  style:
    status_message_type: mix
    candidate_format: "[label]. [candidate] [comment]"
    candidate_list_layout: linear
    text_orientation: horizontal
    inline_preedit: true
    inline_candidate: false
    translucency: false
    mutual_exclusive: false
    memorize_size: false
    showPaging: false
    alpha: 1e+0
    corner_radius: 1.4e+1
    hilited_corner_radius: 1.2e+1
    border_height: 0e+0
    border_width: 0e+0
    line_spacing: 8e+0
    spacing: 4e+0
    base_offset: 4e+0
    shadow_size: 3e+0
    font_face: "AaZanJinXiaoKai-2"
    font_point: 27
    label_font_face: "AaZanJinXiaoKai-2"
    label_font_point: 16
    comment_font_face: "AaZanJinXiaoKai-2"
    comment_font_point: 16
    color_scheme: purity_of_essence

  preset_color_schemes:
    everforest_dark:
      name: "Everforest Dark / Everforest 暗色"
      author: sainnhe/everforest
      color_space: srgb
      back_color: "0xE03B352D"              # bg0 #2D353B, 88% 不透明
      border_color: "0x4D483D"              # bg2 #3D484D
      text_color: "0xAAC6D3"                # fg #D3C6AA
      hilited_text_color: "0xAAC6D3"        # fg
      candidate_text_color: "0xAAC6D3"      # fg
      hilited_candidate_text_color: "0x2D352D"  # bg0，反色增强对比
      hilited_candidate_back_color: "0x80C0A7"  # green #A7C080
      label_color: "0x899285"               # grey1 #859289
      hilited_candidate_label_color: "0x2D352D"
      comment_text_color: "0x788A7A"        # grey0 #7A8478（拼音注释）
      hilited_comment_text_color: "0x475042" # bg_green #425047
