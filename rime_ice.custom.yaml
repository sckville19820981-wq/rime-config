# 雾凇拼音方案自定义补丁，不会被 plum 更新覆盖
# 改完需在菜单栏鼠鬚管图标点「重新部署」才生效

patch:
  # 部件拆字引导符：uU 改成 uu，两个小写字母，不用按 Shift
  # 已验证 uu 不冲突：拼音无 u 开头音节（标准写作 w-），英文词库无 uu 开头的词
  #
  # 注意：prefix 和 recognizer 的正则必须同时改，对不上就会失效
  "radical_lookup/prefix": "uu"
  "recognizer/patterns/radical_lookup": "^uu[a-z]+$"

  # 拆字开启学习。原本是 false，意味着拆字永远不记你的选择：
  # cao'hui 匹配 22 个字，荟 权重 1 排在 20 名开外，选一百次还是在那儿。
  # 开了之后选过的字会往前跑，第二次就在前排。
  "radical_lookup/enable_user_dict": true

  # 拆字候选显示拼音注音。
  # 原本注音来源是 rime_ice，但它的 reverse.bin 只有 58k，压根没覆盖单字读音，
  # 所以 comment 一直是空的 —— 这就是「没标记读法」的原因。
  # 换成 kMandarin（每字 1~2 个最常见读音，带声调），由 plum 装的：
  #   cd ~/plum && bash rime-install mirtlecn/rime-radical-pinyin:extra
  # 备选：zdict（汉典全读音，更全但更杂）、tone、pinyin（含异读，作者不推荐）
  "radical_reverse_lookup/dictionary": kMandarin

  # 拆字候选重排滤镜：常用字提前，生僻字降后。
  # 详细原理见 lua/radical_sort_filter.lua 顶部注释。
  # 挂在链尾（uniquifier 之后），先去重再排序。
  "engine/filters/+":
    - lua_filter@*radical_sort_filter
